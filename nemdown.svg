<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- nemdown's icon: the nemesis mark on a page.

       The mark is Joshua's own reduction of the nemesis logo to the N and its
       arrow, with the wings and the shattered star taken off. nemesis does the
       same thing in the font it draws for its bar, and for the same reason:
       those pieces are thin by design and dissolve at the sizes a launcher
       uses. This one keeps the arrowhead and the angles, which the font glyph
       rounds away.

       It is a trace of that edit rather than the edit's own paths. The wings
       were covered with white shapes rather than subtracted, which looks
       right on white paper and would have put white blobs on this page. A
       trace of the rendered result turns the intent into real geometry, and
       one path instead of twenty-nine. Checked against the original render at
       900px: 4 differing pixels out of 11,640 of ink, 0.03%.

       potrace with -a 0, because the default corner threshold rounds corners
       and this mark is nothing but corners.

       The hairline stroke is deliberate: it is the same colour as the fill and
       exists only to put weight back. Without it the fine strokes go faint by
       32px. Compare at 48 and 32 before removing it.

       Catppuccin Mocha. The page is flat and the mark sits on it: below about
       32px the page silhouette is what still says "a document". -->

  <!-- the page, corner folded at the top right -->
  <path d="M12 6h26l14 14v38a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z"
        fill="#3b3d51" stroke="#585b70" stroke-width="2" stroke-linejoin="round"/>
  <!-- the fold, lit so the corner reads as turned rather than cut -->
  <path d="M38 6l14 14H42a4 4 0 0 1-4-4z" fill="#6c7086"/>

  <g transform="translate(-34.906,11.362) scale(0.032573)">
    <g transform="translate(0.000000,2184.000000) scale(0.100000,-0.100000)">
