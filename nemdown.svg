<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- nemdown's icon: the nemesis mark on a page.

       The mark is nemesis's own, taken from its vector artwork rather than
       redrawn, recoloured to the Catppuccin teal the rest of the app uses.
       Two things had to be corrected on the way in. The artwork is a trace,
       so it carries a layer of grey hairline strokes that are coincident with
       the fills and contribute nothing; and its white shapes are not all
       counters. One of them is the traced BACKGROUND, a full-canvas rectangle
       that is invisible on white paper and paints straight over anything it
       is placed on. Measuring each white path's bounds against the mark's own
       bounds separates the nine real counters from that one. Without it the
       page loses its folded corner and its outline.

       The mark sits on the page rather than replacing it. Below about 48px
       its wings and shards blur, being thin by design, and at that
       point the page silhouette is what still says "a document", which is the
       one thing a launcher icon has to say. The name supplies the "down"; a
       chevron only collided with the mark's own points.

       Catppuccin Mocha throughout. The page is flat, not graduated, so the
       counters can match it exactly. -->

  <!-- the page, corner folded at the top right -->
  <path d="M12 6h26l14 14v38a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z"
        fill="#3b3d51" stroke="#585b70" stroke-width="2" stroke-linejoin="round"/>
  <!-- the fold, lit so the corner reads as turned rather than cut -->
  <path d="M38 6l14 14H42a4 4 0 0 1-4-4z" fill="#6c7086"/>

