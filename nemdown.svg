<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- nemdown's icon: nemesis's mark on a page.

       The mark is the SIMPLIFIED nemesis logo, not the full one. nemesis
       solved this problem already: for its bar it drew a font with the logo
       reduced to the N and its arrow, dropping the wings and the shattered
       star, because those are thin by design and dissolve at small sizes.
       This is that glyph, lifted out of shell/Assets/nemesis.ttf rather than
       simplified again by hand, so the two stay the same mark.

       The full artwork was tried first and is the reason this note exists: it
       is beautiful at 128 and illegible by 48, which is where a launcher
       starts. Reaching for the font was the right move and it was not mine.

       Coordinates come from the glyph outline, so the y-flip below is the
       font's y-up space being turned the right way round, and the ink box is
       the glyph's own bounding box rather than a guess.

       Catppuccin Mocha. The page is flat, not graduated, and the mark sits on
       it rather than replacing it: below about 32px the page silhouette is
       what still says "a document". -->

  <!-- the page, corner folded at the top right -->
  <path d="M12 6h26l14 14v38a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V10a4 4 0 0 1 4-4z"
        fill="#3b3d51" stroke="#585b70" stroke-width="2" stroke-linejoin="round"/>
  <!-- the fold, lit so the corner reads as turned rather than cut -->
  <path d="M38 6l14 14H42a4 4 0 0 1-4-4z" fill="#6c7086"/>

  <g transform="translate(15.000,19.518) scale(0.03320)">
    <g transform="translate(0,1024) scale(1,-1)">
